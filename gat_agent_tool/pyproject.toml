[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gat-agent-tool"
version = "0.1.0"
description = "Wrap a trained Graph Attention Network as an expression-scoring tool for LLM agents (local HuggingFace, MCP servers, OpenAI function-calling)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BD_Paper project" }]
keywords = ["gat", "llm", "agent", "tool-use", "mcp", "biomarker", "symbolic-regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core deps: the GAT itself (torch / torch_geometric / numpy / pandas).
# All three consumer modes (HF loop, MCP, OpenAI) require the core.
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "torch>=2.0",
    "torch-geometric>=2.3",
]

# Optional deps, grouped by consumer mode. Install with `pip install -e .[mcp]`
# or combine: `pip install -e .[mcp,hf,openai]` / `pip install -e .[all]`.
[project.optional-dependencies]
mcp = ["mcp>=1.0"]
hf = ["transformers>=4.40", "accelerate>=0.27"]
openai = ["openai>=1.30"]
real-auc = ["asteval>=0.9.31", "scikit-learn>=1.3"]
all = [
    "mcp>=1.0",
    "transformers>=4.40",
    "accelerate>=0.27",
    "openai>=1.30",
    "asteval>=0.9.31",
    "scikit-learn>=1.3",
]

[project.scripts]
# One unified CLI; subcommands dispatch to the three consumer modes.
gat-agent-tool = "gat_agent_tool.cli:main"
# Convenience alias specifically for MCP launching (matches config-file conventions).
gat-agent-mcp  = "gat_agent_tool.mcp_server:main"
# Multi-disease MCP server: one process serves all 13 ICD checkpoints, routed
# by `disease_id` argument on every tool. Backward-compatible with `gat-agent-mcp`.
gat-agent-multi-mcp = "gat_agent_tool.multi_mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gat_agent_tool*"]

[tool.setuptools.package-data]
"gat_agent_tool" = ["py.typed"]
